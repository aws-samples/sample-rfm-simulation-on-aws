# OpenVLA-OFT (Optimized Fine-Tuning) model configuration
# Paper: "Fine-Tuning Vision-Language-Action Models: Optimizing Speed and Success"
#        arXiv:2502.19645 (Kim et al., 2025)
# Repo:  https://github.com/moojink/openvla-oft (MIT)
# Goal:  LIBERO {Spatial, Object, Goal, Long(10)} evaluation with 1-click deploy on AWS
#
# CLI:   python deploy.py --vla openvla-oft --libero-suite {spatial|object|goal|10|long}
#        (default: 10; alias `long` → `10` — the OFT paper's LIBERO-Long = LIBERO-10)

model:
  id: openvla-oft
  version: "OFT-LIBERO"

  # Per-suite HF checkpoints — revisions validated 2026-05-04
  # Source: huggingface.co/api/models/moojink/openvla-7b-oft-finetuned-libero-{suite}
  suites:
    spatial:
      hf_repo: "moojink/openvla-7b-oft-finetuned-libero-spatial"
      hf_model_revision: "6d0231af0e48c5985f1ff86908f4674b84bc049b"
      task_suite_name: "libero_spatial"
      paper_success_rate: 0.976   # OFT paper Table I (wrist+state inputs)
    object:
      hf_repo: "moojink/openvla-7b-oft-finetuned-libero-object"
      hf_model_revision: "4c89574e1c538b6c102f43f0526d60a9d3650148"
      task_suite_name: "libero_object"
      paper_success_rate: 0.984
    goal:
      hf_repo: "moojink/openvla-7b-oft-finetuned-libero-goal"
      hf_model_revision: "c2d0f9fbbd82674683b397ff923168a12f6a307b"
      task_suite_name: "libero_goal"
      paper_success_rate: 0.979
    # `10` (quoted so YAML keeps it as string key)
    # Alias: `long` → normalised to `10` in generate.py
    "10":
      hf_repo: "moojink/openvla-7b-oft-finetuned-libero-10"
      hf_model_revision: "95220f9a3421a7ff12d4218e73d09ade830fa9a3"
      task_suite_name: "libero_10"
      paper_success_rate: 0.945

  # Suite-common pins (apply to all suites)
  # git ls-remote https://github.com/moojink/openvla-oft.git HEAD
  oft_commit: "e4287e94541f459edc4feabc4e181f537cd569a8"          # Validated: 2026-05-04
  # git ls-remote https://github.com/moojink/transformers-openvla-oft.git HEAD
  transformers_fork_commit: "bc339d9ad707454c0c115970db43c260067c61ab"  # Validated: 2026-05-04
  # LIBERO upstream — pinned commit (repo rarely updated; master)
  libero_commit: "master"

  # Passed UNQUOTED (word-split) to pip by FIX 14 — the renderer pin the eval env must hold
  # after libero_requirements.txt resolves. That file pins robosuite==1.4.1 but leaves mujoco
  # free, and robosuite declares only `mujoco>=2.3.0`, so the resolver takes the latest.
  # mujoco 3.10.0 (2026-06-22) changed the mj_fullM signature and 3.11.0 (2026-07-27) removed
  # mjData.qM outright; robosuite's call site is unchanged through v1.5.1, so the chain must
  # stay below 3.10. Unlike gr00t, this target's setup has no env-creation check, so an
  # unpinned mujoco only surfaces ~9 min into run_libero_eval.py.
  sim_protect_pins: "mujoco==3.3.1"

  # Pinned by FIX 15 — tensorflow-metadata's declared protobuf floor is lower than what its
  # generated code actually needs, so the resolver is free to pick a version that cannot
  # import under this stack's protobuf. 1.17.3 is the newest release whose gencode (4.25.6)
  # and declaration (protobuf>=4.21.6,<=6.32 on py<3.11) both hold on protobuf 4.25.x.
  tfmd_version: "1.17.3"

  # Evaluation flags (align with paper defaults)
  center_crop: true

# Per-suite runtime profile — instance/EBS common, timeout differs because LIBERO-10
# (long-horizon) takes ~3× longer than short-horizon suites (spatial/object/goal).
instance:
  preferred: [g6.xlarge, g5.xlarge, g6.2xlarge, g5.2xlarge]  # ~16GB VRAM sufficient; L4/A10G both OK
  ebs_gb: 250                     # 7B checkpoint ~15GB + flash-attn build + conda env + videos
  ebs_gb_bridge: 250              # bridge not yet supported — same value
  # CreationPolicy timeout per suite (used by CDK stack)
  creationpolicy_timeout:
    spatial: PT120M   # install ~35 + eval ~30-45 + buffer
    object:  PT120M
    goal:    PT120M
    "10":    PT240M   # long-horizon: install ~35 + eval ~90-180 + buffer (existing default)

# Evaluation tasks — structure differs from gr00t (env_name) / pi (suite+num_episodes).
# openvla-oft's run_libero_eval.py iterates all tasks in a suite, so we model suite-level eval.
# `generate.py --libero-suite X` picks the matching entry and passes it to the Jinja template.
tasks:
  spatial:
    - suite: libero_spatial
      num_trials_per_task: 5          # 10 tasks × 5 trials = 50 trials (~30-45min on L4)
      description: "LIBERO-Spatial (10 tasks × 5 trials)"
  object:
    - suite: libero_object
      num_trials_per_task: 5
      description: "LIBERO-Object (10 tasks × 5 trials)"
  goal:
    - suite: libero_goal
      num_trials_per_task: 5
      description: "LIBERO-Goal (10 tasks × 5 trials)"
  "10":
    - suite: libero_10
      num_trials_per_task: 5          # PoC: 5/task × 10 tasks = 50 trials (~90-180min on L4)
      description: "LIBERO-10 long-horizon (10 tasks × 5 trials)"
      # Full paper: num_trials_per_task=50 (500 trials total) takes >10h on single GPU.

# LIBERO-Plus robustness sweep (off unless deployed with --libero-variant plus; see docs/targets.md).
# The sweep runs on the suite (and checkpoint) picked with --libero-suite, e.g.
#   python vlasim.py deploy --vla openvla-oft --libero-suite spatial --libero-variant plus
# (the default suite 10 works too, but LIBERO-Long episodes are ~2x longer). The fork replaces LIBERO
# in the conda env; run_libero_eval.py is patched to loop over the selected variant ids only
# (assets/libero-plus/oft_task_ids_patch.py), one trial each.
libero_plus:
  perturb: [camera, robot, language, light, background, noise, layout]
  variants_per_category: 10        # 7 x 10 variants x 1 trial = 70 episodes (~50-60 min of eval on L4)
  seed: 7
  pip_pins: "Wand==0.6.13 scikit-image==0.24.0"   # extra_requirements.txt of the fork (py3.10, numpy<2)
  creationpolicy_timeout: PT240M   # install ~35 + ckpt ~10 + assets 6.4 GB ~10 + eval ~60 + buffer
  ebs_gb: 270

# LIBERO-R2S real2sim object swap (off unless deployed with --libero-objects real2sim; see docs/targets.md).
# Objects reconstructed by a real2sim stage-1 run (python vlasim.py deploy --vla real2sim) replace LIBERO's HOPE
# objects of the same name; public / collision / full scenes run the same task ids, init states and seed:
#   python vlasim.py deploy --vla openvla-oft --libero-suite object --libero-objects real2sim \
#       --real2sim-run s3://<real2sim results bucket>/<RUN_ID>
# With the HOPE-Video scene 0 default of stage 1: libero_object tasks 0,1,5,7,9 (alphabet soup, cream cheese,
# tomato sauce, milk, orange juice) x 10 trials x 3 conditions = 150 episodes (~2 h of eval on L4).
libero_r2s:
  conditions: [public, collision, full]
  trials_per_task: 10
  scale: fit           # fit = stock bounding-box volume (shape stays the reconstruction's); metric = measured size
  mass: match          # match = stock mass; density = stock density on the reconstructed volume
  select: interest     # interest = tasks whose object of interest is replaced; any = replaced object anywhere
  seed: 7              # run_libero_eval.py default; the same for every condition
  creationpolicy_timeout: PT300M   # install ~35 + ckpt ~10 + eval ~120-150 + buffer
  ebs_gb: 250

# Bridge mode not supported in initial version.
# OpenVLA-OFT client/server split would require a separate policy-server image — deferred.
bridge:
  enabled: false
