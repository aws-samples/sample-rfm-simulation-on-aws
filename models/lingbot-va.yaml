# LingBot-VA (Robbyant) — world action model: autoregressive video + action generation on a Wan2.2 backbone.
# Shared template: lerobot-libero-userdata.sh.j2. License: Apache-2.0 (code and weights), public.
# Eval recipe: LeRobot docs/source/lingbot_va.mdx (libero_10, 128x128 observations).
# LeRobot docs: fits a single 24-32 GB GPU (text encoder on CPU) → g6e (L40S 48 GB) for headroom.
model:
  id: lingbot-va
  display_name: "LingBot-VA"
  policy_desc: "LingBot-VA (Robbyant, autoregressive video-action world model, Wan2.2 backbone)"
  license: "Apache-2.0 (code and weights)"
  hf_repo: "lerobot/lingbot_va_libero_long"
  hf_model_revision: "cf56f4c6f38f104b19b1352bc986b9fa25d98706"
  lerobot_repo: "https://github.com/huggingface/lerobot.git"
  lerobot_commit: "ae2b57f12223c8c5184fcd814eb63cd9ce7de203"   # main 2026-10-13
  python_version: "3.12"
  uv_extras: [lingbot_va, libero]
  policy_module: lingbot_va
  policy_args: []
  env_args:
    - "--env.observation_height=128"
    - "--env.observation_width=128"

instance:
  preferred: [g6e.2xlarge, g6e.4xlarge]
  ebs_gb: 250
  creationpolicy_timeout: PT240M
  min_gpu_mib: 40000
  min_host_mib: 49000

tasks:
  - suite: libero_10
    task_ids: [0, 1]
    n_episodes: 3
    description: "LIBERO-Long pipe-proof (LingBot-VA, 2 tasks x 3 ep)"
    seed: 1000

bridge:
  enabled: false

# LIBERO-Plus robustness sweep (off unless deployed with --libero-variant plus; see docs/targets.md).
# Same checkpoint as the LIBERO run above, so `vlasim results --robustness --vla lingbot-va` can put the two side by
# side. Shared lerobot-libero template = the smolvla recipe (LeRobot docker/Dockerfile.benchmark.libero_plus at
# the same lerobot_commit; --env.type=libero_plus inherits every --env.* arg of LiberoEnv used above).
libero_plus:
  suite: libero_10                 # the only published LingBot-VA LIBERO checkpoint is LIBERO-Long
  perturb: [camera, robot, language, light, background, noise, layout]
  variants_per_category: 2         # ~20 min/episode measured on LIBERO-10: 7 x 2 = 14 episodes ~4.7 h of eval
  seed: 7
  pip_pins: "robosuite==1.4.1 bddl==1.0.1 easydict==1.13 mujoco==3.7.0 matplotlib==3.10.8 Wand==0.6.13 scikit-image==0.25.2 gym==0.26.2"
  creationpolicy_timeout: PT480M   # install ~45 + assets ~10 + eval ~280 + buffer (WaitCondition max is 12 h)
  ebs_gb: 280                      # + 6.4 GB zip and its extracted asset tree
