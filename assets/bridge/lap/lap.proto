syntax = "proto3";

package lap;

// LAP-3B (Language-Action Pre-Training) realtime inference service.
// Backbone: PaliGemma-3B + Flow Matching action expert (JAX, built on openpi).
// Repo: github.com/lihzha/lap (Apache-2.0). Checkpoint: lihzha/LAP-3B-Libero.
service LAPInference {
  // Robot joint action inference (returns an action chunk)
  rpc Infer (InferRequest) returns (InferResponse);
  // Check server / model load status
  rpc Health (HealthRequest) returns (HealthResponse);
}

message InferRequest {
  // Images: two camera views (LAP LIBERO key mapping — model_adapter.py IMAGE_KEYS)
  //   base_image  → observation.base_0_rgb        (third-person view)
  //   wrist_image → observation.left_wrist_0_rgb  (eye-in-hand)
  // JPEG/PNG raw bytes, resized to 224x224 RGB on the server
  bytes  base_image  = 1;
  bytes  wrist_image = 2;

  // Natural-language task instruction (e.g. "pick up the black bowl between the plate and the ramekin")
  string instruction = 3;

  // Robot state, 10-dim: eef_pos(3) + eef_rot6d(6) + gripper(1)
  // Note: LAP LIBERO uses a 6D rotation (not a quaternion), hence 10-dim — unlike π0.5's 8-dim.
  // optional — zero-padded to 10-dim when omitted.
  repeated float state = 4;

  // optional CoT reasoning hint. The flow policy ignores an empty string (only used by CoT configs).
  string frame_description = 5;
}

message InferResponse {
  // actions: float32 row-major bytes, shape = (chunk_length=10, action_dim=7)
  // Restore: np.frombuffer(actions, dtype=np.float32).reshape(chunk_length, action_dim)
  bytes actions = 1;

  // {"chunk_length": 10, "action_dim": 7}
  map<string, int32> shape_info = 2;
}

message HealthRequest {}

message HealthResponse {
  bool healthy      = 1;  // server is running
  bool model_loaded = 2;  // whether the LAP policy is loaded
}
