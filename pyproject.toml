# Project metadata + tool config only. The CLIs are not an installable package:
# run them as `python vlasim.py ...` (deps: `pip install -r requirements.txt`, kept in sync with below).
[project]
name = "sample-rfm-simulation-on-aws"
version = "0.1.0"
description = "Deploy robot foundation model (VLA) simulation benchmarks on AWS with one command"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "ruff"]

[project.urls]
Repository = "https://github.com/aws-samples/sample-rfm-simulation-on-aws"

[tool.ruff]
target-version = "py310"
# Existing code goes up to ~280 columns; E501 is ignored below rather than reformatting the tree.
line-length = 120
extend-exclude = [
    "assets/bridge/**/*_pb2*.py",  # generated by grpcio-tools
    "cdk/node_modules",
    "cdk/cdk.out*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts copied onto the sim instances: Isaac Sim / Isaac Lab must start the app (AppLauncher)
# before omni/isaaclab imports, and the bridges put generated stubs on sys.path first, so import
# order there is load-bearing. Do not let the linter reorder it.
"assets/**/*.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["targets", "generate", "results", "deploy", "destroy", "vlasim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
