# Checks every PR the same way the maintainers verify a change locally:
# CDK compile + unit tests, cdk synth for every target, and userdata render + bash -n.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # No AWS credentials and no CDK_DEFAULT_ACCOUNT: the stacks synthesize environment-agnostic, so
    # cdk synth never needs an AWS call (an explicit dummy account makes the AZ lookup try one).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: cdk
      - run: npx tsc --noEmit
        working-directory: cdk
      - run: npx jest
        working-directory: cdk
      - name: results.py offline check
        run: |
          python results.py --help > /dev/null
          python -c "import results as r; lo, hi = r.wilson(48, 50); assert (round(lo, 2), round(hi, 2)) == (0.87, 0.99), (lo, hi); assert r.wilson(0, 0) == (None, None)"
      - name: render userdata + bash -n (all targets)
        run: |
          for v in $(python -c "import re;print(' '.join(re.findall(r'\"([a-z0-9-]+)\"', re.search(r'choices=\[([^]]+)\]', open('deploy.py').read()).group(1))))"); do
            python generate.py --vla "$v" --output-dir assets/userdata > /dev/null
            bash -n "assets/userdata/$v.sh"
            echo "ok $v"
          done
      - name: cdk synth (all targets)
        working-directory: cdk
        run: |
          for v in $(ls ../assets/userdata/*.sh | xargs -n1 basename | sed 's/\.sh$//'); do
            npx cdk synth -q -c region=us-east-1 -c notify_email=ci@example.com -c vla="$v" --output "cdk.out-$v" > /dev/null
            echo "synth ok $v"
          done
