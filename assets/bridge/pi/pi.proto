syntax = "proto3";

package pi;

// π0.5 (Physical Intelligence) remote inference service
// Reference: openpi pi05_droid config (DROID manipulation)
service PIInference {
  // Robot joint action inference
  rpc Infer (InferRequest) returns (InferResponse);
  // Check server / model load status
  rpc Health (HealthRequest) returns (HealthResponse);
}

message InferRequest {
  bytes  exterior_image = 1;  // exterior camera — JPEG/PNG raw bytes, 224×224 RGB
  bytes  wrist_image    = 2;  // wrist camera — JPEG/PNG raw bytes, 224×224 RGB
  string instruction    = 3;  // natural-language task instruction (e.g. "pick up the cube")

  // robot state, 8-dim: 7 joints + 1 gripper (optional — zero-padded when omitted)
  repeated float state  = 4;
}

message InferResponse {
  // actions: shape=(chunk_length=15, action_dim=8), dtype=float32, row-major
  // Restore: np.frombuffer(response.actions, dtype=np.float32).reshape(-1, 8)
  bytes actions = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy      = 1;  // server is running
  bool model_loaded = 2;  // whether the π0.5 model is loaded
}
