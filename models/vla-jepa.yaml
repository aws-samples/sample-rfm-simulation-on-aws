# VLA-JEPA (Sun et al., "VLA-JEPA: Enhancing Vision-Language-Action Model with Latent World Model",
# arXiv:2602.10098) x LIBERO — the LeRobot port, through upstream lerobot-eval (shared lerobot-libero template).
# Qwen3-VL-2B backbone + flow-matching DiT-B action head; a V-JEPA 2 latent world model is the training objective
# (training only: "At inference time only the Qwen backbone and action head are used", LeRobot
# docs/source/vla_jepa.mdx). One checkpoint for all four LIBERO suites (authors' LIBERO/config.yaml on
# ginwind/VLA-JEPA @db32b4a4: data_mix libero_all, 30k steps from their Pretrain checkpoint).
#
# CLI:   python deploy.py --vla vla-jepa [--task-set actions | probe | spatial | object | long]
#
# Checkpoint: lerobot/VLA-JEPA-LIBERO, converted by LeRobot from ginwind/VLA-JEPA LIBERO/checkpoints/VLA-JEPA-LIBERO.pt
#   (same 6.16 GB of weights in safetensors + LeRobot processor files). Policy class `vla_jepa` is in LeRobot at the
#   shared lerobot_commit below (src/lerobot/policies/vla_jepa, pyproject extra `vla_jepa`); the later vla_jepa
#   commits on LeRobot main (#4813 starting-noise argument, #4835 / #5098 world-model RoPE) do not change inference.
# Backbones: the policy constructor calls from_pretrained on Qwen/Qwen3-VL-2B-Instruct and on
#   facebook/vjepa2-vitl-fpc64-256 (then the checkpoint overwrites their weights); both are downloaded at pinned
#   revisions and passed as local paths (`extra_downloads` -> --policy.qwen_model_name / --policy.jepa_encoder_name),
#   so nothing is resolved from a moving Hub branch except the checkpoint repo itself (pre-downloaded at its pin).
# Eval settings follow the authors' examples/LIBERO/eval_libero.py (ginwind/VLA-JEPA @ec907778): LIBERO rendered at
#   256 x 256 (LIBERO_ENV_RESOLUTION) and resized to 224 by the policy, 10 settle steps, suite max steps 300 for
#   LIBERO-Goal (LeRobot TASK_SUITE_MAX_STEPS is the same table), action chunk of 7 executed open loop, gripper
#   snapped and binarised (checkpoint config), seed 7.
# Published (paper Table 1, 50 episodes per task): Spatial 96.2, Object 99.6, Goal 97.2, LIBERO-10 95.8, avg 97.2.
#   LeRobot docs/source/vla_jepa.mdx "Expected results" for this port (10 episodes per task): spatial 95.0,
#   object 100.0, goal 98.0, libero_10 93.0.
# License: Apache-2.0 (VLA-JEPA code and weights; LeRobot); Qwen3-VL-2B-Instruct Apache-2.0; V-JEPA 2 MIT.
model:
  id: vla-jepa
  display_name: "VLA-JEPA"
  policy_desc: "VLA-JEPA (Qwen3-VL-2B + DiT-B flow-matching action head, V-JEPA 2 latent world model in training), LeRobot port, LIBERO checkpoint"
  license: "Apache-2.0 (VLA-JEPA code and weights, LeRobot); Qwen3-VL-2B-Instruct Apache-2.0; V-JEPA 2 MIT"
  hf_repo: "lerobot/VLA-JEPA-LIBERO"
  hf_model_revision: "735d9f692981e286ade093b5046627eda876e5d0"   # 2026-07-06
  lerobot_repo: "https://github.com/huggingface/lerobot.git"
  lerobot_commit: "ae2b57f12223c8c5184fcd814eb63cd9ce7de203"   # main 2026-10-13 (lerobot 0.6.2), as smolvla
  python_version: "3.12"
  uv_extras: [vla_jepa, libero]
  policy_module: vla_jepa
  policy_args: []
  env_args:
    # The authors render LIBERO at 256 x 256 (training data resolution); the LeRobot LIBERO env default is 360.
    - "--env.observation_height=256"
    - "--env.observation_width=256"
  extra_downloads:
    - repo: "Qwen/Qwen3-VL-2B-Instruct"
      revision: "89644892e4d85e24eaac8bacfd4f463576704203"   # 2025-10-23, 4.27 GB
      policy_arg: qwen_model_name
    - repo: "facebook/vjepa2-vitl-fpc64-256"
      revision: "b3c1679b7c34d3255ef3547f27c7b226aefab26f"   # 2025-08-11
      policy_arg: jepa_encoder_name
      allow_patterns: ["config.json", "model.safetensors", "video_preprocessor_config.json"]   # 1.3 GB, not original/

instance:
  # Qwen3-VL-2B + V-JEPA 2 ViT-L + DiT-B in bf16, ~6 GB of weights: one 24 GB L4 / A10G. The 16 GB host of an
  # .xlarge holds the 4.3 GB backbone load plus the 6.2 GB checkpoint; .2xlarge as capacity fallback.
  preferred: [g6.xlarge, g5.xlarge, g6.2xlarge, g5.2xlarge]
  ebs_gb: 150            # DLAMI + venv (~15 GB) + 11.7 GB of weights + LIBERO + videos
  creationpolicy_timeout: PT180M   # setup ~30-45 min + 3 x 10 episodes (estimate; not measured)
  min_gpu_mib: 20000
  min_host_mib: 15000

# Tasks: one entry per LIBERO task (task_ids = one id, env_name = the LIBERO task name at that id, checked at render
# time and again on the instance), so every task gets its own summary.txt / action_type. Episode k uses LIBERO's
# fixed init state k. Same three LIBERO-Goal tasks as `univla` / `ge-act`.
tasks:
  - {suite: libero_goal, task_ids: [1], env_name: put_the_bowl_on_the_stove, n_episodes: 10, seed: 7,
     published: "97.2 % LIBERO-Goal suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 98.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
     description: "LIBERO-Goal: put the bowl on the stove"}
  - {suite: libero_goal, task_ids: [6], env_name: put_the_cream_cheese_in_the_bowl, n_episodes: 10, seed: 7,
     published: "97.2 % LIBERO-Goal suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 98.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
     description: "LIBERO-Goal: put the cream cheese in the bowl"}
  - {suite: libero_goal, task_ids: [8], env_name: put_the_bowl_on_the_plate, n_episodes: 10, seed: 7,
     published: "97.2 % LIBERO-Goal suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 98.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
     description: "LIBERO-Goal: put the bowl on the plate"}

task_sets:
  # Non-pick-and-place tasks of LIBERO-Goal (same checkpoint): open a drawer, push a plate, turn a stove knob.
  actions:
    description: "LIBERO-Goal: open the middle drawer, push the plate, turn on the stove (3 x 10 episodes)"
    tasks:
      - {suite: libero_goal, task_ids: [0], env_name: open_the_middle_drawer_of_the_cabinet, n_episodes: 10, seed: 7,
         published: "97.2 % LIBERO-Goal suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 98.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Goal: open the middle drawer of the cabinet"}
      - {suite: libero_goal, task_ids: [5], env_name: push_the_plate_to_the_front_of_the_stove, n_episodes: 10, seed: 7,
         published: "97.2 % LIBERO-Goal suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 98.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Goal: push the plate to the front of the stove"}
      - {suite: libero_goal, task_ids: [7], env_name: turn_on_the_stove, n_episodes: 10, seed: 7,
         published: "97.2 % LIBERO-Goal suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 98.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Goal: turn on the stove"}
  # Timing probe before the full runs: one task, 2 episodes (setup + model load + 2 rollouts).
  probe:
    description: "LIBERO-Goal: put the bowl on the stove, 2 episodes (timing probe)"
    tasks:
      - {suite: libero_goal, task_ids: [1], env_name: put_the_bowl_on_the_stove, n_episodes: 2, seed: 7,
         published: "97.2 % LIBERO-Goal suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 98.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Goal: put the bowl on the stove (probe, 2 episodes)"}
  # The other suites of the same checkpoint (trained on all four): two tasks x 10 episodes each.
  spatial:
    description: "LIBERO-Spatial tasks 0 and 1 (2 x 10 episodes)"
    tasks:
      - {suite: libero_spatial, task_ids: [0],
         env_name: pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate,
         n_episodes: 10, seed: 7,
         published: "96.2 % LIBERO-Spatial suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 95.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Spatial: black bowl between the plate and the ramekin"}
      - {suite: libero_spatial, task_ids: [1],
         env_name: pick_up_the_black_bowl_next_to_the_ramekin_and_place_it_on_the_plate,
         n_episodes: 10, seed: 7,
         published: "96.2 % LIBERO-Spatial suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 95.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Spatial: black bowl next to the ramekin"}
  object:
    description: "LIBERO-Object tasks 0 and 1 (2 x 10 episodes)"
    tasks:
      - {suite: libero_object, task_ids: [0], env_name: pick_up_the_alphabet_soup_and_place_it_in_the_basket,
         n_episodes: 10, seed: 7,
         published: "99.6 % LIBERO-Object suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 100.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Object: alphabet soup into the basket"}
      - {suite: libero_object, task_ids: [1], env_name: pick_up_the_cream_cheese_and_place_it_in_the_basket,
         n_episodes: 10, seed: 7,
         published: "99.6 % LIBERO-Object suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 100.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-Object: cream cheese into the basket"}
  long:
    description: "LIBERO-10 tasks 2 and 3 (stove + moka pot, bowl into drawer + close it; 2 x 10 episodes)"
    tasks:
      - {suite: libero_10, task_ids: [2], env_name: KITCHEN_SCENE3_turn_on_the_stove_and_put_the_moka_pot_on_it,
         n_episodes: 10, seed: 7,
         published: "95.8 % LIBERO-10 suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 93.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-10: turn on the stove and put the moka pot on it"}
      - {suite: libero_10, task_ids: [3],
         env_name: KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it,
         n_episodes: 10, seed: 7,
         published: "95.8 % LIBERO-10 suite (paper Table 1, 50 ep x 10 tasks); LeRobot port 93.0 % (vla_jepa.mdx, 10 ep x 10 tasks)",
         description: "LIBERO-10: put the black bowl in the bottom drawer and close it"}

bridge:
  enabled: false
