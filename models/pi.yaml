# π0.5 (openpi) model configuration
# Reference: https://github.com/Physical-Intelligence/openpi

model:
  id: pi
  version: "0.5"
  # openpi_commit: git ls-remote https://github.com/Physical-Intelligence/openpi.git HEAD
  openpi_commit: "650c5b0283a49c42784fb5055a0507da2c6d347d"  # Pinned 2026-04-18

instance:
  preferred: [g5.xlarge, g5.2xlarge, g6.xlarge, g6.2xlarge]
  ebs_gb: 200
  ebs_gb_bridge: 100  # Bridge mode: no checkpoint download — Docker images ~10GB + bridge ~1GB
  creationpolicy_timeout: PT240M  # install ~30min + 2 suites × 90min + buffer

tasks:
  - suite: libero_spatial
    num_episodes: 10
    description: "LIBERO Spatial (10 tasks × 10 episodes)"

  - suite: libero_object
    num_episodes: 5
    description: "LIBERO Object (10 tasks × 5 episodes)"

# Available suites: libero_spatial, libero_object, libero_goal, libero_100
# Expected performance (pi05_libero, arXiv:2504.16054):
#   libero_spatial: ~85-95%
#   libero_object: ~80-90%
#   libero_goal: ~75-85%

# Bridge mode (experimental) — bring-your-own π0.5 gRPC endpoint behind an NLB (leave empty for local mode)
# vpc_id = the VPC that hosts your endpoint; nlb_endpoint = its host:port (proto: assets/bridge/pi/)
bridge:
  vpc_id: ""       # e.g. vpc-xxxxxxxxxxxxxxxxx
  nlb_endpoint: "" # e.g. internal-xxx.elb.us-east-1.amazonaws.com:50052

# LIBERO-Plus robustness sweep (off unless deployed with --libero-variant plus; see docs/targets.md).
# Same pi05_libero checkpoint as the LIBERO run above, so `vlasim results --robustness --vla pi` can put the
# two side by side. The fork replaces third_party/libero on the host (the client container mounts it); the
# client image is Python 3.8, so the fork's extra deps are pinned to the last 3.8 wheels below and installed
# with openpi's examples/libero/requirements.txt as the constraint (numpy 1.22.4, robosuite 1.4.1).
libero_plus:
  suite: libero_spatial
  perturb: [camera, robot, language, light, background, noise, layout]
  variants_per_category: 10        # 7 x 10 variants x 1 episode = 70 episodes
  seed: 7
  pip_pins: "Wand==0.6.13 scikit-image==0.21.0 networkx==3.1 tifffile==2023.7.10 PyWavelets==1.4.1 lazy_loader==0.4"
  creationpolicy_timeout: PT240M   # install + both images ~45 + assets 6.4 GB ~10 + 7 dims x ~10 min + buffer
  ebs_gb: 230                      # + 6.4 GB zip and its extracted asset tree
