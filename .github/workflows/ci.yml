# Checks every PR the same way the maintainers verify a change locally:
# CDK compile + unit tests, cdk synth for every target, userdata render + bash -n (build),
# pre-commit hooks incl. ruff (lint) and relative links + #anchors in the Markdown docs (links).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # No AWS credentials and no CDK_DEFAULT_ACCOUNT: the stacks synthesize environment-agnostic, so
    # cdk synth never needs an AWS call (an explicit dummy account makes the AZ lookup try one).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pytest
      - run: npm ci --no-audit --no-fund
        working-directory: cdk
      - run: npx tsc --noEmit
        working-directory: cdk
      - run: npx jest
        working-directory: cdk
      - name: results.py --help (imports without AWS credentials)
        run: python results.py --help > /dev/null
      # tests/: target-list parity (CLIs, models/, cdk/bin/app.ts), every target renders and passes
      # bash -n (test_render.py), results.py parsing + Wilson interval against a fake S3 (test_results.py).
      - name: pytest
        run: python -m pytest -q
      # real2sim stage scripts on synthetic data (segmentation, frame conversion, MuJoCo grasp replay with
      # MuJoCo Menagerie fetched at the pinned commit). Skipped in the run above: it has no numpy.
      - name: pytest (real2sim geometry + MuJoCo)
        run: |
          pip install "numpy<2" scipy trimesh==5.2.0 rtree open3d==0.18.0 mujoco==3.16.0
          python -m pytest -q tests/test_real2sim.py
      # targets.py is the single source of the --vla targets; the parity test above ties it to
      # deploy/destroy/generate/vlasim, models/*.yaml and the cdk/bin/app.ts maps.
      - name: render userdata + bash -n (all targets)
        run: |
          for v in $(python targets.py); do
            python generate.py --vla "$v" --output-dir assets/userdata > /dev/null
            bash -n "assets/userdata/$v.sh"
            echo "ok $v"
          done
      # Advisory for now (audit A18): all rendered scripts were clean at -S error when this was added;
      # make it blocking (drop continue-on-error) once it has stayed green for a while.
      - name: shellcheck -S error rendered userdata (non-blocking)
        continue-on-error: true
        run: shellcheck -S error assets/userdata/*.sh
      - name: cdk synth (all targets)
        working-directory: cdk
        run: |
          n=0
          for v in $(cd .. && python targets.py); do
            npx cdk synth -q -c region=us-east-1 -c notify_email=ci@example.com -c vla="$v" --output "cdk.out-$v" > /dev/null
            echo "synth ok $v"
            n=$((n + 1))
          done
          echo "synthesized $n targets"
          test "$n" -gt 0
      # Video history gallery: the shared RFM-Gallery app, and one target with the gallery context on
      # (GalleryPublisher Lambda + S3 notification); both under cdk-nag like the targets above.
      - name: cdk synth (gallery)
        working-directory: cdk
        run: |
          npx cdk synth -q --app "npx ts-node --prefer-ts-exts bin/gallery.ts" -c region=us-east-1 --output cdk.out-gallery > /dev/null
          g=0123456789abcdef0123456789abcdef
          npx cdk synth -q -c region=us-east-1 -c notify_email=ci@example.com -c vla=smolvla \
            -c gallery_bucket=rfm-gallery-ci-us-east-1 -c gallery_hash=$g -c gallery_url=https://d111.cloudfront.net/g/$g/ \
            --output cdk.out-smolvla-gallery > /dev/null
          echo "synth ok gallery"
      # Post-run judges (targets.py JUDGE_TARGETS, e.g. flora-judge): render + bash -n, then synth the
      # judge app against a placeholder run of one target (no AWS call: the run is plain CDK context).
      - name: render + cdk synth (post-run judges)
        working-directory: cdk
        run: |
          for j in $(cd .. && python targets.py --judge); do
            (cd .. && python generate.py --judge-target "$j" --output-dir assets/userdata > /dev/null && bash -n "assets/userdata/$j.sh")
            npx cdk synth -q --app "npx ts-node --prefer-ts-exts bin/judge.ts" -c region=us-east-1 -c notify_email=ci@example.com \
              -c judge="$j" -c judge_target=smolvla -c judge_target_stack=SmolVLA-Demo \
              -c judge_bucket=vla-sim-results-smolvla-demo-us-east-1-123456789012 -c judge_run=2026-10-20-0130 \
              --output "cdk.out-$j" > /dev/null
            echo "synth ok $j"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  links:
    # Relative links (files, images, videos) and #anchors only: --offline skips external URLs,
    # so the job is deterministic and needs no network beyond the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0 (lychee v0.24.2)
        with:
          args: --offline --include-fragments --no-progress './*.md' './docs/**/*.md'
          fail: true
