# vla-eval — allenai/vla-evaluation-harness run UNMODIFIED on one EC2 GPU instance.
# Template: templates/vlaeval-userdata.sh.j2 (+ assets/vlaeval/vlaeval_results.py, stdlib-only adapter).
#
# The harness is a runtime dependency, not vendored: the instance installs `vla-eval==<harness_version>` from
# PyPI into a uv-managed Python venv and clones the matching tag for its configs/ (they are not in the wheel).
# It then runs the harness's own two halves on the same host, as its README describes:
#   - model server:     `vla-eval serve --config <model_servers.<name>.config>` (the harness's PEP 723 script,
#                       resolved by uv with the harness's own exclude-newer date) on localhost:8000
#   - benchmark client: `vla-eval run --config <rendered eval config>`, which starts the benchmark's Docker image
#                       (pulled by digest) and talks to the server over WebSocket
# Nothing of the harness is patched. The only overrides are config values the harness documents
# (server.timeout, docker.user, recording.record_video) and the model-server `--arg checkpoint=<path>` that
# points the server at a checkpoint snapshot downloaded at a pinned Hugging Face revision (or, for a server that
# downloads by repo id itself, `--arg <arg>=<repo id>` under HF_HUB_OFFLINE=1 with the cache's main = the pin).
#
# One (benchmark suite x model server) pair = one `tasks:` entry = one `task-N/summary.txt`. Adding a pair:
# add the benchmark image under vlaeval.benchmarks (if new), the server under vlaeval.model_servers (if new) and
# one tasks / task_sets entry naming both.
#
# Measured recipe (2026-11-08, ap-northeast-2, g6e.2xlarge, by hand over SSM before this target existed):
# LIBERO-Spatial 10 tasks x 5 episodes, seed 7, LeRobot pi0.5 = 50/50 in 453 s of eval, ~36 min launch to
# terminate, ~USD 1.65. See docs/targets.md Note 23.
#
# Licenses: harness Apache-2.0. Each benchmark, simulator image and checkpoint keeps its own license
# (LIBERO MIT; lerobot/pi05_libero_finetuned: Gemma terms, its PaliGemma tokenizer repo is gated;
# Dexmal/maniskill2-db-cogact (task set maniskill2): card license `cc` without a variant -> NON-COMMERCIAL until
# confirmed; Yinpei/pi05_baseline (robomme): card Apache-2.0, fine-tuned from the PaliGemma-derived pi0.5 base;
# DuoBench's image contains Robot Control Stack, AGPL-3.0). See docs/licenses.md.
model:
  id: vlaeval
  display_name: "vla-eval (allenai/vla-evaluation-harness)"
  policy_desc: "model servers and benchmark images of the harness, unmodified (default: LeRobot pi0.5 x LIBERO-Spatial)"
  license: "harness Apache-2.0; each benchmark image, model server and checkpoint keeps its own license"
  harness_repo: "https://github.com/allenai/vla-evaluation-harness.git"
  harness_version: "0.9.0"                                   # PyPI vla-eval (uploaded 2026-11-03)
  harness_commit: "8798464b2e3317f49b259dca8861aea04f75bb59"  # tag v0.9.0; configs/ come from this checkout
  python_version: "3.11"                                     # vla-eval needs >= 3.11; the DLAMI ships 3.10
  huggingface_hub_version: "2.4.0"                           # only for the pinned checkpoint pre-download

vlaeval:
  # Benchmark images: pulled by digest; `vla-eval run` finds them locally and never pulls a moving tag.
  benchmarks:
    libero:
      benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/libero"
      image_digest: "sha256:bc9930a7e42f970bdde7f3aaddaab0c223bd8e7e922e387cd9eb48aa89ccf2f1"   # 8.84 GB
      simulator: "LIBERO (robosuite / MuJoCo)"
      license: "LIBERO MIT; image built by the harness"
    # Per benchmark, optional (defaults = the LIBERO behaviour above):
    #   suite_param / seed_param  constructor arg that gets the entry's suite / seed (default suite / seed; null =
    #                             the benchmark takes none and nothing is injected: Benchmark(**params) would fail)
    #   docker_env                NAME=value list -> the run config's docker.env (`docker run -e`)
    #   expect_videos             false = zero episode videos is not a failure (no renderable frame)
    #   init_states               how episode start states are chosen (summary.txt init_states)
    # All three images below are the 0.9.0 tag (= latest) of the harness's own ghcr.io/allenai packages, read
    # anonymously by digest on 2026-11-09 (no mirror needed).
    libero-mem:
      benchmark: "vla_eval.benchmarks.libero_mem.benchmark:LIBEROMemBenchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/libero-mem"
      image_digest: "sha256:5f78cc5ee5b6105d5a4457ad96795565f368f934318c66863d03b2b66aa74a62"   # 5.57 GB compressed
      simulator: "LIBERO-Mem (robosuite / MuJoCo)"
      license: "libero-mem MIT; LIBERO MIT; image built by the harness"
    calvin:
      benchmark: "vla_eval.benchmarks.calvin.benchmark:CALVINBenchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/calvin"
      image_digest: "sha256:6d018bfe4cdeb3af2c8841e4504e4e613a1f8c9acdd040eec3b8c81c7af20174"   # 2.56 GB compressed
      simulator: "CALVIN (PyBullet)"
      license: "CALVIN MIT; validation sequences baked into the image"
      suite_param: null                                  # CALVINBenchmark takes no suite
      docker_env: ["NVIDIA_DRIVER_CAPABILITIES=all"]     # as configs/benchmarks/calvin/eval.yaml (PyBullet EGL)
      init_states: "sequences drawn from the validation set with params.seed (CALVIN protocol)"
    kinetix:
      benchmark: "vla_eval.benchmarks.kinetix.benchmark:KinetixBenchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/kinetix"
      image_digest: "sha256:a8f6565dd4e260032de2d83ed948a475388571437424bd5716c3af811b3aaaeb"   # 5.50 GB compressed
      simulator: "Kinetix (JAX 2D physics)"
      license: "Kinetix MIT; RTC levels from Physical-Intelligence/real-time-chunking-kinetix (MIT)"
      suite_param: null                                  # KinetixBenchmark takes no suite
      # the container's JAX (cuda12) shares the GPU with the RTC server's JAX; both preallocate 75 % by default
      docker_env: ["XLA_PYTHON_CLIENT_PREALLOCATE=false"]
      expect_videos: false                               # symbolic observations have no frame to record
      init_states: "episode i = PRNGKey(params.seed + i) on the RTC level (Kinetix protocol)"
    # Batch B. robocerebra and maniskill2 are the 0.9.0 tag (= latest) of ghcr.io/allenai/vla-evaluation-harness;
    # the allenai molmospaces package is not anonymously readable (HTTP 403 on 2026-11-09), so it comes from
    # ghcr.io/worv-ai/vla-evaluation-harness-public, the mirror the harness itself falls back to on a failed pull
    # (src/vla_eval/cli/_docker.py _REGISTRY_MIRRORS, issue #73). Digests read anonymously on 2026-11-09.
    #   render                    gpu | cpu -> the run config's top-level render: (unset = the harness default, gpu)
    robocerebra:
      benchmark: "vla_eval.benchmarks.robocerebra.benchmark:RoboCerebraBenchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/robocerebra"
      image_digest: "sha256:89ad3218a46e1b3d2e4926ef788a9d3bce312bbe900c37e75a27b93e1be80c34"   # 3.02 GB compressed
      simulator: "RoboCerebra (LIBERO fork, robosuite / MuJoCo)"
      license: "RoboCerebra code: no license file detected [unverified]; RoboCerebraBench data (HF qiukingballball/RoboCerebraBench, baked in): no license stated; LIBERO MIT"
      suite_param: null                                  # RoboCerebraBenchmark takes no suite (it does take seed)
      init_states: "every episode of a task starts from demo_1 state 0 of its demo.hdf5, env seeded with params.seed"
    molmospaces:
      benchmark: "vla_eval.benchmarks.molmospaces.benchmark:MolmoSpacesBenchmark"
      image: "ghcr.io/worv-ai/vla-evaluation-harness-public/molmospaces"
      image_digest: "sha256:ca13e61b0b67031298c4e1347c33e0b853abc35caaad4169961a3b14ea07e141"   # 12.32 GB compressed
      simulator: "MolmoSpaces (MuJoCo, Franka FR3)"
      license: "molmospaces code: GitHub reports Other; assets from HF allenai/molmospaces (ODC-BY, CC-BY-4.0), baked in; image from the worv-ai mirror"
      suite_param: null                                  # MolmoSpacesBenchmark takes neither suite nor seed
      seed_param: null
      init_states: "task i = episode i of the JSON benchmark (fixed scene and poses; the harness sets exp_config.seed 42)"
    maniskill2:
      benchmark: "vla_eval.benchmarks.maniskill2.benchmark:ManiSkill2Benchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/maniskill2"
      image_digest: "sha256:3c4d35caae55a3eec6daa608fcb095354bbbde8fd905b6d714d40bb9d8192191"   # 4.90 GB compressed
      simulator: "ManiSkill2 (SAPIEN 2.2.2, Vulkan)"
      license: "ManiSkill2: no license detected by GitHub [unverified]; YCB / EGAD assets baked into the image [unverified]"
      suite_param: null                                  # ManiSkill2Benchmark takes neither suite nor seed
      seed_param: null
      # render: cpu  = the harness's lavapipe fallback if SAPIEN finds no NVIDIA Vulkan ICD in the container (the
      #                image's base sets NVIDIA_DRIVER_CAPABILITIES=all and ships the NVIDIA ICD; the GPU path worked on AWS 2026-11-09)
      init_states: "env.reset() without a seed (the benchmark passes none): episode start states are not reproducible"
    # Batch C. vlabench and mikasa-robo are the 0.9.0 tag (= latest) of ghcr.io/allenai/vla-evaluation-harness; the
    # allenai robomme, robocasa365 and duobench packages are not anonymously readable (no pull token on 2026-11-09),
    # so they come from the harness's own pull fallback ghcr.io/worv-ai/vla-evaluation-harness-public (as
    # molmospaces). For vlabench and mikasa-robo, present in both registries, the digests are identical. Digests
    # read anonymously on 2026-11-09; 0.9.0 = latest for all five.
    #   action_dim                width of the zero action of the echo smoke (kind: echo; harness default 7)
    robomme:
      benchmark: "vla_eval.benchmarks.robomme.benchmark:RoboMMEBenchmark"
      image: "ghcr.io/worv-ai/vla-evaluation-harness-public/robomme"
      image_digest: "sha256:2b5fa71bb4742209415b2e57786672f0878a7746214cd2f9c2438d1482143561"   # 9.46 GB compressed
      simulator: "RoboMME (ManiSkill3 fork, SAPIEN 3)"
      license: "robomme_benchmark Apache-2.0; ManiSkill fork (YinpeiDai/ManiSkill) Apache-2.0; image from the worv-ai mirror"
      suite_param: null                                  # RoboMMEBenchmark takes neither suite nor seed
      seed_param: null
      docker_env: ["NVIDIA_DRIVER_CAPABILITIES=all"]     # as configs/benchmarks/robomme/counting.yaml
      render: cpu                                        # as the harness's configs: the GPU path hangs on some hosts (issue #112)
      init_states: "episode i = episode i of the RoboMME test split (BenchmarkEnvBuilder.make_env_for_episode(i), fresh env per episode)"
    robocasa365:
      benchmark: "vla_eval.benchmarks.robocasa365.benchmark:RoboCasa365Benchmark"
      image: "ghcr.io/worv-ai/vla-evaluation-harness-public/robocasa365"
      image_digest: "sha256:abbdba198214cb6edc66594d2a0dd295e2ac6d015ae58ed959c91d0ec58d7cf6"   # 16.71 GB compressed
      simulator: "RoboCasa365 (robosuite 1.5.2 / MuJoCo, Panda-Omron)"
      license: "robocasa MIT (GitHub reports Other); robosuite MIT; ~10 GB kitchen assets baked in (Objaverse / LightWheel / AI-generated objects, no single license stated) [unverified]; image from the worv-ai mirror"
      suite_param: null                                  # RoboCasa365Benchmark takes seed, not suite
      init_states: "episode i of a task = env.reset(seed=params.seed + i) in a pretrain kitchen (RoboCasa365 protocol)"
    vlabench:
      benchmark: "vla_eval.benchmarks.vlabench.benchmark:VLABenchBenchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/vlabench"
      image_digest: "sha256:3b7b83180bbd3d5fb2ed0e9573b357e7020a3fe6e75ba2eb5cf4f2c4e2e5d58b"   # 8.67 GB compressed
      simulator: "VLABench (dm_control / MuJoCo)"
      license: "VLABench MIT; its object / scene assets (downloaded from Google Drive at image build, baked in): license not stated [unverified]"
      suite_param: null                                  # VLABenchBenchmark takes neither suite nor seed
      seed_param: null
    mikasa-robo:
      benchmark: "vla_eval.benchmarks.mikasa.benchmark:MIKASABenchmark"
      image: "ghcr.io/allenai/vla-evaluation-harness/mikasa-robo"
      image_digest: "sha256:f6b1ffbce9d865316b6cde115e0edb6ff54983c5ce7a81491c357dbd8ab2d1da"   # 5.98 GB compressed
      simulator: "MIKASA-Robo (ManiSkill3 / SAPIEN, Vulkan)"
      license: "MIKASA-Robo MIT; ManiSkill3 (mani_skill 3.0.0b15) Apache-2.0"
      suite_param: null                                  # MIKASABenchmark takes neither suite nor seed
      seed_param: null
      action_dim: 8                                      # as configs/benchmarks/mikasa/eval.yaml
    duobench:
      benchmark: "vla_eval.benchmarks.duobench.benchmark:DuoBenchBenchmark"
      image: "ghcr.io/worv-ai/vla-evaluation-harness-public/duobench"
      image_digest: "sha256:fa59eb45132d5c8beeb9634a9985be82b4adb8c48fb6492ed7a1c4dca6814604"   # 2.53 GB compressed
      simulator: "DuoBench (MuJoCo + Robot Control Stack, bimanual FR3 Duo)"
      license: "duobench v0.1.0 Apache-2.0; Robot Control Stack v0.7.1 AGPL-3.0 (inside the image, run unmodified); image from the worv-ai mirror"
      suite_param: null                                  # DuoBenchBenchmark takes seed, not suite
      action_dim: 16                                     # as configs/benchmarks/duobench/smoke_test.yaml (cartesian_tquat)
  # Model servers: a config path inside the harness checkout (configs/model_servers/...). The checkpoint the
  # config names is downloaded at hf_model_revision and passed as `--arg <checkpoint_arg>=<snapshot path>`.
  model_servers:
    lerobot-pi05-libero:
      config: "configs/model_servers/lerobot/pi05_libero.yaml"
      checkpoint_arg: checkpoint
      # The config names lerobot/pi05_libero_finetuned, which the Hub redirects to this repo; its main = 7152f13e
      # (2026-10-06) is what the 2026-11-08 run resolved. Downloaded by its canonical id (no redirect needed).
      hf_repo: "lerobot/pi05_libero_finetuned_v044"
      hf_model_revision: "7152f13e34c6c115d808aea0e5d08aca74eac14b"
      # pi0.5 loads its tokenizer from this gated repo: the HF token in SSM /vla-simulator/hf-token must belong
      # to an account that accepted its license (checked before anything is installed).
      gated_repos: ["google/paligemma-3b-pt-224"]
      license: "Gemma terms (checkpoint card: gemma); PaliGemma tokenizer gated"
      published: "LeRobot: Spatial 97.0 / Object 99.0 / Goal 98.0 / Long 96.0 (50 episodes per task)"
    xvla-calvin:
      config: "configs/model_servers/xvla/calvin.yaml"
      checkpoint_arg: model_path      # xvla.py from_pretrained(model_path): a local snapshot dir works
      hf_repo: "2toINF/X-VLA-Calvin-ABC_D"            # the config's own model_path; ungated (HF API 2026-11-09)
      hf_model_revision: "d76710ee314ee1fa8506f421664c989b40bae415"   # = main (2025-11-15), 3.52 GB, self-contained
      license: "Apache-2.0 (X-VLA code and weights)"
      published: "CALVIN ABC->D avg len 4.43 (paper) / 4.30 (harness reproduction, 1000 sequences)"
    rtc-kinetix:
      config: "configs/model_servers/rtc/rtc.yaml"
      # No Hugging Face checkpoint: the server fetches the public gs://rtc-assets/bc/31/policies (12 x 12.3 MB
      # worlds_l_<level>.pkl, md5-checked against the bucket listing) into the vla-eval assets cache on first use,
      # and clones Physical-Intelligence/real-time-chunking-kinetix at 9296f31d (pinned in rtc.py). The bucket
      # has no object versions pinned here; its md5 list as read on 2026-11-09 is in docs/targets.md Note 23.
      license: "MIT (real-time-chunking-kinetix); the checkpoint bucket states no license"
      published: "RTC 12-level average 0.922 at d=0 (paper Fig. 5, 2048 rollouts per level)"
    molmobot-droid:
      config: "configs/model_servers/molmobot/droid.yaml"
      checkpoint_arg: hf_repo
      hf_repo: "allenai/MolmoBot-DROID"                  # the config's own hf_repo; ungated (HF API 2026-11-09)
      hf_model_revision: "cbe6ec358958d07ddfb20d3aa54e560e9e1b18c9"   # = main, 19.99 GB: model.pt + config.yaml
      checkpoint_marker: model.pt                        # no config.json in this repo
      # molmobot.py calls require_model_available(hf_repo) and snapshot_download(hf_repo) itself, so a local path is
      # not a valid argument: it gets the repo id and runs with HF_HUB_OFFLINE=1 against the pinned cache.
      checkpoint_pass: repo_id
      # olmo's build_tokenizer loads AutoTokenizer.from_pretrained("Qwen/Qwen3-4B-Instruct-2507") (the checkpoint's
      # config.yaml model.llm.tokenizer.identifier): offline, it has to be in the cache too.
      hf_offline_repos:
        - {repo: "Qwen/Qwen3-4B-Instruct-2507", revision: "cdbee75f17c01a7cc42f958dc650907174af0554",
           allow_patterns: ["*.json", "*.txt"], license: "Apache-2.0"}
      license: "Apache-2.0 (MolmoBot code and weights); Qwen3 tokenizer Apache-2.0"
      published: "MolmoSpaces pick-and-place 57.0 % (harness reproduction) / 57.7 % (paper)"
    db-cogact-maniskill2:
      config: "configs/model_servers/db_cogact/maniskill2.yaml"
      checkpoint_arg: model_path      # cogact.py from_pretrained(model_path) + <model_path>/norm_stats.json: a snapshot dir works
      hf_repo: "Dexmal/maniskill2-db-cogact"              # the config's own model_path; ungated (HF API 2026-11-09)
      hf_model_revision: "d4af8d4e8a07ef4c9f982f52d446d14f2039e81c"   # = main, 16.06 GB
      # At load, dexbotic also reads Qwen/Qwen2.5-7B (config) and openai/clip-vit-large-patch14-336 from the Hub at
      # main (named in the checkpoint's config.json); those two are not pinned here.
      license: "checkpoint card license: cc (variant not stated, treated as non-commercial until confirmed); dexbotic MIT; base Qwen2.5-7B Apache-2.0"
      published: "ManiSkill2 5-task average 58 (PickCube 90 / StackCube 65; Dexmal card, not reproduced by the harness)"
    # Batch C.
    #   checkpoint_subdir         path only: the server gets <snapshot>/<subdir> (marker looked up inside it)
    #   torch_lock                false = leave the script out of the CUDA 12 `uv lock --script` check
    mme-vla-pi05:
      config: "configs/model_servers/mme_vla/pi05_baseline.yaml"
      checkpoint_arg: checkpoint
      hf_repo: "Yinpei/pi05_baseline"                    # the config's own checkpoint; ungated (HF API 2026-11-09)
      hf_model_revision: "80caa59a4933804b6521e72981b107ae0051d32a"   # = main (2026-03-10), 11.55 GB: one zip
      checkpoint_marker: "pi05_baseline/79999.zip"       # no config.json; the server extracts the zip itself
      # mme_vla.py splits `checkpoint` on "/" (org/repo[/subdir]) and calls require_model_available + snapshot_download
      # itself, so a snapshot path is not a valid argument: repo id + HF_HUB_OFFLINE=1 against the pinned cache, as
      # MolmoBot. It extracts the zip under the snapshot (<snapshot>/_extracted/79999, ~11.6 GB more disk).
      checkpoint_pass: repo_id
      # `uv lock --script mme_vla.py` fails (openpi needs numpy<2 but pandas>=3.0.1, which needs numpy>=2.3.3 on
      # Python >= 3.14: the universal lock has no solution), while its env for Python 3.11 resolves torch 2.7.1 and
      # jax 0.5.3 with CUDA 12 wheels (uv pip compile --python-version 3.11 --python-platform x86_64-manylinux_2_28
      # with the script's exclude-newer, 2026-11-09): no torch constraint is needed, and the check would stop the run.
      torch_lock: false
      # openpi @ RoboMME/robomme_policy_learning has the submodule third_party/robomme_benchmark as
      # git@github.com:RoboMME/robomme_benchmark.git: without this the server died in 21 s on AWS (2026-11-09,
      # "Host key verification failed" in `uv run`). The repository itself is public over HTTPS.
      git_https: true
      license: "checkpoint card Apache-2.0 (fine-tuned from openpi pi0.5 base, PaliGemma-derived: the Gemma terms may also apply [unverified]); robomme_policy_learning (openpi fork) Apache-2.0"
      published: "RoboMME counting 25.5 % (harness reproduction, 4 tasks x 50 episodes) / 22.72 % (paper, 9-run average)"
    groot-robocasa365:
      config: "configs/model_servers/groot/robocasa365.yaml"
      checkpoint_arg: model_path      # Gr00tPolicy: a local dir is used as is (snapshot_download(<path>) raises, caught)
      hf_repo: "robocasa/robocasa365_checkpoints"        # ungated (HF API 2026-11-09), 327 GB repo
      hf_model_revision: "c484448aba1a9b60a04c9b0ca117241518ea69f3"   # = main (2026-08-04)
      checkpoint_subdir: "gr00t_n1-5/multitask_learning/checkpoint-120000"   # the folder the config names
      # 7.59 GB of the 16.14 GB folder: weights, config and experiment_cfg/metadata.json (the norm stats Gr00tPolicy
      # loads), not optimizer.pt (8.55 GB) / rng_state / scheduler / trainer_state
      hf_allow_patterns:
        - "gr00t_n1-5/multitask_learning/checkpoint-120000/config.json"
        - "gr00t_n1-5/multitask_learning/checkpoint-120000/model-*.safetensors"
        - "gr00t_n1-5/multitask_learning/checkpoint-120000/model.safetensors.index.json"
        - "gr00t_n1-5/multitask_learning/checkpoint-120000/experiment_cfg/*"
      # robocasa365_groot.py pins torch 2.7.0 (CUDA 12) and flash-attn 2.7.4.post1 (sdist, no-build-isolation). Its
      # setup.py first downloads the release wheel for the torch / CUDA major / Python / C++ ABI it finds
      # (flash_attn-2.7.4.post1+cu12torch2.7cxx11abi{TRUE,FALSE}-cp311-cp311-linux_x86_64.whl exist on the GitHub
      # release, read 2026-11-09) and only compiles from source when that fails. `uv lock --script` resolves it
      # (no CUDA 13 wheels, checked 2026-11-09), so the CUDA 12 step leaves it unchanged.
      license: "checkpoints Apache-2.0 (card); GR00T N1.5 fork robocasa-benchmark/Isaac-GR00T Apache-2.0"
      published: "none for a 1-task smoke (the RoboCasa365 paper reports the 50-task target split; the harness lists this pair as not attempted)"
  # Values written into every rendered eval config (all documented harness config keys).
  run:
    server_timeout: 900     # cold first episode warmed up for 216 s; the harness default of 30 s fails it
    docker_user: host       # results not owned by root
    record_video: true      # off by default in the harness
    port: 8000

instance:
  preferred: [g6e.2xlarge, g6e.4xlarge, g6e.xlarge]   # g6e.2xlarge measured (1x L40S 46 GB, ~10 GB used)
  ebs_gb: 250              # measured volume; libero image 8.8 GB + server venv + 7 GB checkpoint
  creationpolicy_timeout: PT120M   # measured 36 min launch -> terminate
  min_gpu_mib: 22000
  min_host_mib: 30000

# Per entry: suite (benchmark params.suite / subname), benchmark, model_server, episodes_per_task, seed,
# optional max_tasks / max_steps / params (extra benchmark params), condition, description, published. No
# action_type: a suite row mixes motions, so it is tagged from the suite name like other suite-level entries.
tasks:
  - &spatial
    suite: libero_spatial
    benchmark: libero
    model_server: lerobot-pi05-libero
    episodes_per_task: 5
    seed: 7
    params: {num_steps_wait: 10}
    description: "LIBERO-Spatial, 10 tasks x 5 episodes (LeRobot pi0.5 through vla-eval)"
    published: "97.0 (LeRobot, 50 episodes per task)"

task_sets:
  probe:
    description: "LIBERO-Spatial task 0 x 1 episode (cold-start timing)"
    tasks:
      - {<<: *spatial, max_tasks: 1, episodes_per_task: 1, description: "LIBERO-Spatial probe, 1 task x 1 episode"}
  object:
    description: "LIBERO-Object, 10 tasks x 5 episodes"
    tasks:
      - {<<: *spatial, suite: libero_object, description: "LIBERO-Object, 10 tasks x 5 episodes",
         published: "99.0 (LeRobot, 50 episodes per task)"}
  goal:
    description: "LIBERO-Goal, 10 tasks x 5 episodes"
    tasks:
      - {<<: *spatial, suite: libero_goal, description: "LIBERO-Goal, 10 tasks x 5 episodes",
         published: "98.0 (LeRobot, 50 episodes per task)"}
  long:
    description: "LIBERO-10 (long horizon), 10 tasks x 5 episodes"
    tasks:
      - {<<: *spatial, suite: libero_10, description: "LIBERO-10, 10 tasks x 5 episodes",
         published: "96.0 (LeRobot, 50 episodes per task)"}
  # Batch A: three more benchmarks of the harness, each with a paired server (smoke sizes, not the full protocols).
  libero-mem:
    description: "LIBERO-Mem 2 tasks x 3 episodes, LeRobot pi0.5 (LIBERO fine-tune) zero-shot"
    tasks:
      - &libero_mem
        suite: libero_mem
        benchmark: libero-mem
        model_server: lerobot-pi05-libero
        episodes_per_task: 3
        max_tasks: 2
        seed: 7
        params: {num_steps_wait: 10}
        description: "LIBERO-Mem, 2 tasks x 3 episodes (pi0.5 LIBERO checkpoint, zero-shot)"
        published: "none (checkpoint not trained on LIBERO-Mem)"
  calvin:
    description: "CALVIN ABC->D, 5 sequences x 5 chained subtasks, X-VLA"
    tasks:
      - &calvin
        suite: calvin_abc_d
        benchmark: calvin
        model_server: xvla-calvin
        episodes_per_task: 1
        seed: 0
        params: {dataset_path: /data/calvin/dataset/validation, num_sequences: 5}
        description: "CALVIN ABC->D, 5 sequences (X-VLA through vla-eval)"
        published: "avg len 4.43 / 5-of-5 chain 78.8 % (X-VLA paper, 1000 sequences)"
  kinetix:
    description: "Kinetix RTC levels, 4 levels x 5 rollouts, RTC (sync, d=0)"
    tasks:
      - &kinetix
        suite: kinetix_rtc
        benchmark: kinetix
        model_server: rtc-kinetix
        episodes_per_task: 5
        max_tasks: 4
        seed: 0
        params: {observation_type: symbolic, max_episode_steps: 256, rtc_worlds_dir: /app/rtc/worlds,
                 action_noise_std: 0.1}
        description: "Kinetix, 4 RTC levels x 5 rollouts (RTC through vla-eval)"
        published: "12-level avg 0.922 at d=0 (paper; a 4-level subset is not comparable)"
  batch-a:
    description: "LIBERO-Mem + CALVIN + Kinetix smokes on one instance (servers switched per task)"
    tasks: [*libero_mem, *calvin, *kinetix]
  # Batch B: RoboCerebra (zero-shot), MolmoSpaces x MolmoBot, ManiSkill2 x DB-CogACT, smoke sizes. Rendered and
  # unit-tested; not yet run on AWS.
  robocerebra:
    description: "RoboCerebra Ideal 2 tasks x 2 episodes, LeRobot pi0.5 (LIBERO fine-tune) zero-shot"
    tasks:
      - &robocerebra
        suite: robocerebra_ideal
        benchmark: robocerebra
        model_server: lerobot-pi05-libero
        episodes_per_task: 2
        max_tasks: 2
        seed: 7
        params: {robocerebra_root: /workspace/RoboCerebra_Bench, task_types: [Ideal]}
        description: "RoboCerebra Ideal, 2 tasks x 2 episodes (pi0.5 LIBERO checkpoint, zero-shot)"
        published: "none (checkpoint not trained on RoboCerebra)"
  molmospaces:
    description: "MolmoSpaces-Bench pick-and-place, 4 of 200 episodes, MolmoBot-DROID"
    tasks:
      - &molmospaces
        suite: molmospaces_pick_and_place
        benchmark: molmospaces
        model_server: molmobot-droid
        episodes_per_task: 1
        max_tasks: 4
        max_steps: 600
        seed: 0
        params: {benchmark_dir: /assets/benchmarks/molmospaces-bench-v2/procthor-objaverse/FrankaPickandPlaceHardBench/FrankaPickandPlaceHardBench_20260212_200ep_json_benchmark,
                 eval_config_cls: "molmo_spaces.evaluation.configs.evaluation_configs:DummyPickPlaceEvalConfig",
                 task_horizon: 600, send_wrist_image: true, send_state: true}
        description: "MolmoSpaces pick-and-place, 4 episodes (MolmoBot-DROID through vla-eval)"
        published: "57.0 % (harness reproduction, 200 episodes; a 4-episode subset is not comparable)"
  maniskill2:
    description: "ManiSkill2 PickCube + StackCube x 3 episodes, DB-CogACT"
    tasks:
      - &maniskill2
        suite: maniskill2_pick_stack
        benchmark: maniskill2
        model_server: db-cogact-maniskill2
        episodes_per_task: 3
        max_steps: 400
        seed: 0
        params: {tasks: [PickCube-v0, StackCube-v0], max_episode_steps: 400, render_resolution: [256, 256],
                 enabled_cameras: [base_camera]}
        description: "ManiSkill2 PickCube-v0 + StackCube-v0, 3 episodes each (DB-CogACT through vla-eval)"
        published: "PickCube 90 / StackCube 65 (Dexmal card; not reproduced by the harness)"
  batch-b:
    description: "RoboCerebra + MolmoSpaces + ManiSkill2 smokes on one instance (servers switched per task)"
    tasks: [*robocerebra, *molmospaces, *maniskill2]
  # Batch C: RoboMME x MME-VLA pi0.5, RoboCasa365 x GR00T N1.5, and echo smokes (`vla-eval test`, no model) of
  # VLABench, MIKASA-Robo and DuoBench. Rendered and unit-tested; not yet run on AWS. instance: overrides the
  # volume / WaitCondition timeout for that set only (deploy.py passes -c task_set=<name>).
  robomme:
    description: "RoboMME counting SwingXtimes x 2 episodes, MME-VLA pi0.5 baseline"
    tasks:
      - &robomme
        suite: robomme_counting
        benchmark: robomme
        model_server: mme-vla-pi05
        episodes_per_task: 2
        seed: 0
        params: {tasks: [SwingXtimes], action_space: joint_angle, max_steps: 1300}
        description: "RoboMME counting, SwingXtimes x 2 episodes (MME-VLA pi0.5 baseline through vla-eval)"
        published: "SwingXtimes 40.0 % (harness reproduction, 50 episodes; 2 episodes are not comparable)"
  robocasa365:
    description: "RoboCasa365 KettleBoiling x 2 episodes, GR00T N1.5 multitask"
    instance: {creationpolicy_timeout: PT180M}   # if flash-attn has to compile from source (~1 h+ on 8 vCPU, estimate)
    tasks:
      - &robocasa365
        suite: robocasa365_kettle_boiling
        benchmark: robocasa365
        model_server: groot-robocasa365
        episodes_per_task: 2
        seed: 0
        params: {tasks: [KettleBoiling], split: pretrain, camera_size: 256, success_check_interval: 16}
        description: "RoboCasa365 KettleBoiling x 2 episodes at the registry horizon (GR00T N1.5 through vla-eval)"
        published: "none for one task (GR00T N1.5 baseline of the RoboCasa365 paper: 50-task target split)"
  echo-smokes:
    description: "VLABench + MIKASA-Robo + DuoBench echo smokes (vla-eval test: zero actions, 1 episode each, no model)"
    tasks:
      - &vlabench_echo
        suite: vlabench_echo
        benchmark: vlabench
        kind: echo
        params: {tasks: [select_fruit, select_toy, select_drink], robot: franka, max_steps: 200}
        description: "VLABench echo smoke (vla-eval test, first task x 1 episode, zero actions)"
        published: "none (echo smoke: plumbing check, not a policy score)"
      - &mikasa_echo
        suite: mikasa_robo_echo
        benchmark: mikasa-robo
        kind: echo
        params: {tasks: [RememberColor3-v0, ShellGameTouch-v0, RotateLenientPos-v0, InterceptSlow-v0, TakeItBack-v0],
                 render_resolution: [256, 256]}
        description: "MIKASA-Robo echo smoke (vla-eval test, first task x 1 episode, zero actions)"
        published: "none (echo smoke: plumbing check, not a policy score)"
      - &duobench_echo
        suite: duobench_echo
        benchmark: duobench
        kind: echo
        seed: 0
        params: {task_ids: [ball_maze], send_state: true}
        description: "DuoBench echo smoke (vla-eval test, ball_maze x 1 episode, zero actions)"
        published: "none (echo smoke: plumbing check, not a policy score)"
  batch-c:
    description: "RoboMME + RoboCasa365 smokes and the three echo smokes on one instance"
    # five images (~86 GB uncompressed by the harness README) + checkpoints (~31 GB with the extracted RoboMME zip)
    # + two server envs: more than batch-b's ~91 GB, and ~2-2.5 h end to end (estimates)
    instance: {ebs_gb: 350, creationpolicy_timeout: PT240M}
    tasks: [*robomme, *robocasa365, *vlabench_echo, *mikasa_echo, *duobench_echo]

bridge:
  enabled: false
