# SmolVLA-450M (Hugging Face) — compact VLA (SmolVLM2 backbone + flow-matching action expert).
# Shared template: lerobot-libero-userdata.sh.j2. License: Apache-2.0 (code and weights), public.
# The LIBERO checkpoint names its cameras camera1/camera2 → map the LIBERO agentview / wrist views onto them.
model:
  id: smolvla
  display_name: "SmolVLA-450M"
  policy_desc: "SmolVLA-450M (Hugging Face, SmolVLM2 backbone + flow-matching action expert)"
  license: "Apache-2.0 (code and weights)"
  hf_repo: "lerobot/smolvla_libero"
  hf_model_revision: "a24f1f380461b665158d52acd140152c79e8b36d"
  lerobot_repo: "https://github.com/huggingface/lerobot.git"
  lerobot_commit: "ae2b57f12223c8c5184fcd814eb63cd9ce7de203"   # main 2026-10-13
  python_version: "3.12"
  uv_extras: [smolvla, libero]
  policy_module: smolvla
  policy_args: []
  env_args:
    - '--env.camera_name_mapping={"agentview_image":"camera1","robot0_eye_in_hand_image":"camera2"}'

instance:
  preferred: [g6.xlarge, g5.xlarge, g6.2xlarge, g5.2xlarge]   # <4GB VRAM; smallest GPU tier
  ebs_gb: 120
  creationpolicy_timeout: PT150M
  min_gpu_mib: 15000
  min_host_mib: 15000

tasks:
  - suite: libero_spatial
    task_ids: [0, 1]
    n_episodes: 5
    description: "LIBERO-Spatial pipe-proof (SmolVLA-450M, 2 tasks x 5 ep)"
    seed: 1000

bridge:
  enabled: false

# LIBERO-Plus robustness sweep (off unless deployed with --libero-variant plus; see docs/targets.md).
# Same checkpoint as the LIBERO run above, so `vlasim results --robustness` can put the two side by side.
# Install recipe = LeRobot docker/Dockerfile.benchmark.libero_plus at the lerobot_commit above: the fork
# replaces hf-libero in the venv and needs robosuite 1.4.1 (it uses single_arm_env, removed in 1.5).
libero_plus:
  suite: libero_spatial
  perturb: [camera, robot, language, light, background, noise, layout]
  variants_per_category: 10        # 7 x 10 variants x 1 episode = 70 episodes (~20-35 min of eval)
  seed: 7
  pip_pins: "robosuite==1.4.1 bddl==1.0.1 easydict==1.13 mujoco==3.7.0 matplotlib==3.10.8 Wand==0.6.13 scikit-image==0.25.2 gym==0.26.2"
  # Optional: evaluate a checkpoint fine-tuned on LIBERO-Plus data instead (not the same policy as the
  # LIBERO baseline, so its drop is not comparable): hf_repo: lerobot/smolvla_libero_plus,
  # hf_model_revision: bb424c8a430f483a7e9aafb24a1a47f5c951eae5 (Apache-2.0).
  creationpolicy_timeout: PT180M   # install ~30 + assets 6.4 GB ~10 + eval ~35 + buffer
  ebs_gb: 150                      # + 6.4 GB zip and its extracted asset tree
